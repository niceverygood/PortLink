<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./_shared.css" />
    <style>
      /* Base = 1080×1920 (Google Play 정확한 9:16). Apple은 sharp로 contain + navy padding. */
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, #0a2540 0%, #061b2e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 96px 60px 60px;
      }

      /* === 헤더 영역 (상단 카피) === */
      .header {
        text-align: center;
        max-width: 920px;
        margin-bottom: 60px;
      }
      .pill {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        background: rgba(255, 107, 53, 0.18);
        color: var(--orange-light);
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 24px;
        letter-spacing: 0.02em;
      }
      .headline {
        font-size: 70px;
        font-weight: 900;
        color: var(--white);
        letter-spacing: -0.04em;
        line-height: 1.12;
      }
      .headline span {
        color: var(--orange);
      }
      .subline {
        margin-top: 18px;
        font-size: 26px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
      }

      /* === 폰 프레임 === */
      .phone-wrap {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .phone-frame {
        width: 760px;
        height: 1100px;
        border-radius: 56px;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.5),
          0 0 0 10px #1f2937;
      }
      .phone-notch {
        height: 30px;
      }
      .phone-status-bar {
        font-size: 18px;
        padding: 8px 32px 4px;
      }

      /* === 폰 안 콘텐츠 — Driver PWA 미니 재현 === */
      .driver-hero {
        background: var(--navy);
        color: var(--white);
        padding: 28px 36px 36px;
      }
      .driver-hero .brand-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 22px;
      }
      .driver-hero .label {
        font-size: 18px;
        opacity: 0.7;
      }
      .driver-hero .big-num {
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -0.04em;
        margin-top: 6px;
        white-space: nowrap;
      }
      .driver-stats {
        display: flex;
        gap: 14px;
        margin-top: 24px;
      }
      .stat {
        flex: 1;
        background: rgba(255, 255, 255, 0.1);
        padding: 14px 16px;
        border-radius: 14px;
      }
      .stat .k {
        font-size: 14px;
        opacity: 0.6;
      }
      .stat .v {
        font-size: 24px;
        font-weight: 800;
        margin-top: 4px;
        white-space: nowrap;
      }
      .stat.urgent {
        background: rgba(255, 107, 53, 0.2);
        border: 1px solid var(--orange);
      }
      .stat.urgent .v {
        color: var(--orange);
      }

      .driver-body {
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--slate-50);
      }
      .card {
        background: var(--white);
        border-radius: 18px;
        padding: 20px 22px;
      }
      .card-urgent {
        border: 2px solid var(--orange);
      }
      .card-warn {
        background: rgba(254, 226, 226, 0.6);
        border: 2px solid var(--rose);
      }
      .card-success {
        background: rgba(209, 250, 229, 0.6);
        border: 2px solid var(--emerald);
      }
      .card-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-label {
        font-size: 15px;
        color: var(--slate-500);
        font-weight: 600;
      }
      .card-value {
        font-size: 32px;
        font-weight: 900;
        color: var(--navy);
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .badge-warn {
        background: var(--rose-light);
        color: var(--rose);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
      }
      .badge-success {
        background: var(--emerald-light);
        color: var(--emerald);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
      }
      .route-box {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--slate-100);
        padding: 16px 18px;
        border-radius: 14px;
        margin-top: 12px;
      }
      .route-box .place {
        flex: 1;
        text-align: center;
      }
      .route-box .place .l {
        font-size: 13px;
        color: var(--slate-500);
      }
      .route-box .place .n {
        font-size: 26px;
        font-weight: 800;
        color: var(--navy);
        margin-top: 2px;
        white-space: nowrap;
      }
      .route-box .arrow {
        color: var(--orange);
        font-size: 26px;
      }
      .cta-button {
        background: var(--orange);
        color: var(--white);
        padding: 22px;
        border-radius: 18px;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        margin-top: 8px;
        white-space: nowrap;
      }
      .timeline {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .timeline .step {
        flex: 1;
        height: 10px;
        background: var(--slate-300);
        border-radius: 5px;
      }
      .timeline .step.done {
        background: var(--emerald);
      }
      .timeline .step.active {
        background: var(--orange);
      }
      .footer-tag {
        text-align: center;
        margin-top: 28px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 18px;
      }

      /* === 화면 콘텐츠 fallback (text wrapping 안전) === */
      .body-text {
        font-size: 17px;
        line-height: 1.5;
      }
      .body-text-bold {
        font-size: 19px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="canvas" id="capture">
      <div class="header">
        <span class="pill" id="pill">⚡ 컨테이너 차주 전용</span>
        <h1 class="headline" id="headline">빈 차로<br /><span>돌아가지 마세요</span></h1>
        <p class="subline" id="subline">한 번에 알려드립니다</p>
      </div>
      <div class="phone-wrap">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-status-bar">
            <span>9:41</span>
            <span>•••</span>
            <span class="tabular">100%</span>
          </div>
          <div id="screen"></div>
        </div>
      </div>
      <p class="footer-tag">PortLink Driver</p>
    </div>
    <script>
      window.__setContent = function (cfg) {
        if (cfg.pill) document.getElementById('pill').textContent = cfg.pill;
        if (cfg.headline) document.getElementById('headline').innerHTML = cfg.headline;
        if (cfg.subline) document.getElementById('subline').textContent = cfg.subline;
        document.getElementById('screen').innerHTML = cfg.screenHtml;
      };
    </script>
  </body>
</html>
