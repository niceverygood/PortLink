services:
  postgres:
    image: postgres:16-alpine
    container_name: portlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portlink
      POSTGRES_PASSWORD: portlink_dev
      POSTGRES_DB: portlink
      TZ: Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - portlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portlink -d portlink']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portlink_pgdata:
    name: portlink_pgdata
